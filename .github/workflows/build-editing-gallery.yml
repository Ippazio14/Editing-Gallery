name: Build Editing Gallery APK
on:
  push:
    branches: [main, accessible-editor, scoped-folder-access]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check database migration
        run: python tools/check_favorites_migration.py
      - name: Check folder traversal and setup flow
        run: ./gradlew :app:testFossDebugUnitTest --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Build signed debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Editing-Gallery-APK
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 30
