name: Preview APK

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/preview-apk.yml"
      - "gradle/**"
      - "gradle.properties"
      - "*.gradle.kts"

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK (FOSS debug)
        run: ./gradlew --no-daemon :app:assembleFossDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: gallery-foss-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
